# Production-style stack (full build, healthchecks. For real deployments put
# TLS + a reverse proxy in front and inject secrets via your orchestrator).
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env (shell or .env beside this file):
#   POSTGRES_PASSWORD, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_API_URL (public origin!)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
    # No host port published — the DB is only reachable on the internal network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot migration step; the API only starts when migrations complete.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: pnpm --filter api exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cdrl}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cdrl}
      PORT: '4000'
      CORS_ORIGIN: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Loopback-only: a host-level reverse proxy (Caddy/Nginx) fronts the API.
      - '${BIND_ADDR:-127.0.0.1}:4000:4000'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time — must be PUBLIC URLs.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      # Server-side reads at runtime (ISR revalidation, internal fetches).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_started
    ports:
      # Loopback-only: a host-level reverse proxy (Caddy/Nginx) fronts the site.
      - '${BIND_ADDR:-127.0.0.1}:3000:3000'
    restart: unless-stopped

volumes:
  postgres-data:
