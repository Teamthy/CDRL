# Local development stack: database only. Run the apps on the host:
#   docker compose up -d postgres
#   pnpm prisma:generate && pnpm prisma:migrate && pnpm prisma:seed
#   pnpm dev            # web on :3000
#   pnpm dev:api        # api on :4000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: enables Redis-backed (shared) rate limiting for the API.
  redis:
    image: redis:7-alpine
    profiles: ['ratelimit']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
